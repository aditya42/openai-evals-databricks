name: Validate evaluation integration offline
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: uv sync --locked --all-extras
      - run: npm ci --no-audit --no-fund
      - run: uv run --no-sync python -m pytest
      - run: uv run --no-sync python -m llm_eval.dashboard build

